name: Deploy Lambda Function

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Lambda version to deploy (e.g., v1.0.0, v2.1.3, or latest)'
        required: false
        default: 'latest'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Initialize Terraform
        run: terraform init

      - name: Plan Terraform deployment
        env:
          TF_VAR_image_tag: ${{ github.event.inputs.version }}
        run: terraform plan

      - name: Apply Terraform deployment
        env:
          TF_VAR_image_tag: ${{ github.event.inputs.version }}
        run: terraform apply -auto-approve

      - name: Get deployment info
        run: |
          FUNCTION_URL=$(terraform output -raw lambda_function_url)
          echo "🚀 Lambda Function URL: $FUNCTION_URL"
          echo "📦 Deployed version: ${{ github.event.inputs.version }}"
