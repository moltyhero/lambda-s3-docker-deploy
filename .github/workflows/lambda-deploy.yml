name: Deploy Lambda Function

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Lambda version to deploy (e.g., v1.0.0, v2.1.3, or latest)'
        required: false
        default: 'latest'
        type: string

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init

      - name: Plan Terraform deployment
        env:
          TF_VAR_image_tag: ${{ github.event.inputs.version }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
        run: terraform plan

      - name: Apply Terraform deployment
        env:
          TF_VAR_image_tag: ${{ github.event.inputs.version }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
        run: terraform apply -auto-approve

      - name: Get deployment info
        run: |
          FUNCTION_URL=$(terraform output -raw lambda_function_url)
          echo "🚀 Lambda Function URL: $FUNCTION_URL"
          echo "📦 Deployed version: ${{ github.event.inputs.version }}"
