name: Deploy Lambda

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Lambda image version (defaults to latest)'
        required: false
        default: 'latest'

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Initialize Terraform
        run: terraform init

      - name: Import S3 Bucket
        run: terraform import aws_s3_bucket.lambda_bucket lambda-s3-file-reader-bucket || true

      - name: Import IAM Role
        run: terraform import aws_iam_role.lambda_execution_role lambda-s3-file-reader-execution-role || true

      - name: Import ECR Repository
        run: terraform import aws_ecr_repository.lambda_repository lambda-s3-file-reader-repo || true

  deploy:
    runs-on: ubuntu-latest
    needs: import

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Initialize Terraform
        run: terraform init

      - name: Plan Terraform deployment
        env:
          IMAGE_VERSION: ${{ github.event.inputs.version }}
        run: terraform plan -var "image_version=${{ env.IMAGE_VERSION }}"

      - name: Apply Terraform deployment
        env:
          IMAGE_VERSION: ${{ github.event.inputs.version }}
        run: terraform apply -var "image_version=${{ env.IMAGE_VERSION }}" -auto-approve
